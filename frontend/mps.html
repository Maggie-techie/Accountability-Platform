<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountability Platform - MPs</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <header>
        <h1>Accountability Platform</h1>
        <p>MPs & Constituency Development Fund</p>
    </header>

    <nav>
        <a href="index.html">Dashboard</a>
        <a href="mps.html" class="active">MPs</a>
        <a href="governor.html">Governor</a>
        <a href="findings.html">Audit Findings</a>
        <a href="allocations.html">Allocations</a>
        <a href="compare.html">Compare Leaders</a>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Constituency Performance Overview</h2>
                <div class="mt-2">
                    <input type="text" id="constituency-search" placeholder="Search constituencies..." class="search-input" style="width: 100%; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 4px;">
                </div>
            </div>
            <div class="card-body">
                <div id="constituencies-list">
                    <!-- Constituency cards will be loaded here -->
                    <div class="loading-skeleton" style="height: 100px; width: 100%; margin-bottom: 1rem;"></div>
                    <div class="loading-skeleton" style="height: 100px; width: 100%; margin-bottom: 1rem;"></div>
                    <div class="loading-skeleton" style="height: 100px; width: 100%;"></div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 Accountability Platform. Promoting transparency in public fund utilization.</p>
    </footer>

    <script>
        function initPage() {
            loadConstituencies();
        }

        async function loadConstituencies() {
            const listContainer = document.getElementById('constituencies-list');
            const searchInput = document.getElementById('constituency-search');

            try {
                // In a real app, we'd fetch constituencies from /api/constituency/
                // For now, we'll simulate with some example data
                const constituencies = [
                    {slug: 'muranga', name: 'Muranga'},
                    {slug: 'kieni', name: 'Kieni'},
                    {slug: 'mathira', name: 'Mathira'},
                    {slug: 'otuguchai', name: 'Othaya'},
                    {slug: 'tetu', name: 'Tetu'}
                ];

                // Filter based on search
                const filtered = constituencies.filter(c =>
                    c.name.toLowerCase().includes(searchInput.value.toLowerCase())
                );

                listContainer.innerHTML = '';

                filtered.forEach(constituency => {
                    const card = document.createElement('div');
                    card.className = 'card mb-3';
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>${constituency.name} Constituency</h3>
                        </div>
                        <div class="card-body">
                            <div class="ai-analysis">
                                <div class="ai-analysis-header">AI Analysis: Risk Score</div>
                                <div class="ai-analysis-content">
                                    <div class="ai-text-panel" id="risk-text-${constituency.slug}">
                                        Loading risk analysis...
                                    </div>
                                    <div class="chart-container" id="risk-chart-${constituency.slug}" style="height: 200px;">
                                        <!-- Chart will be rendered here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    listContainer.appendChild(card);

                    // Load AI data for this constituency
                    loadConstituencyAI(constituency.slug);
                });

                // Add search event listener
                searchInput.addEventListener('input', loadConstituencies);

            } catch (error) {
                console.error('Error loading constituencies:', error);
                listContainer.innerHTML = '<p>Error loading constituencies. Please try again later.</p>';
            }
        }

        async function loadConstituencyAI(slug) {
            const textPanel = document.getElementById(`risk-text-${slug}`);
            const chartContainer = document.getElementById(`risk-chart-${slug}`);

            if (!textPanel || !chartContainer) return;

            // Show loading
            textPanel.innerHTML = '<div class="loading-skeleton" style="height: 60px;"></div>';
            utils.showLoading(chartContainer);

            try {
                const response = await fetch(`/api/ai/mp/${slug}/risk_score`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                if (!data.success) {
                    throw new Error('API returned unsuccessful response');
                }

                // Render text panel
                textPanel.innerHTML = `
                    <p><strong>Risk Level:</strong> ${data.data.narrative_fields?.risk_level || 'N/A'}</p>
                    <p><strong>Summary:</strong> ${data.data.narrative_fields?.summary || 'No summary available'}</p>
                    <footer>Data source: NGCDF allocations, audit findings, and budget execution reports for FY 2022-2027</footer>
                `;

                // Render chart (Gauge for risk score)
                chartContainer.innerHTML = '<canvas></canvas>';
                const ctx = chartContainer.querySelector('canvas').getContext('2d');

                // Destroy existing chart if any
                if (chartContainer.chart instanceof Chart) {
                    chartContainer.chart.destroy();
                }

                const riskScore = data.data.chart_data?.risk_score || 50;
                let color = '#10b981'; // Green
                if (riskScore >= 70) color = '#ef4444'; // Red
                else if (riskScore >= 40) color = '#f59e0b'; // Yellow

                chartContainer.chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Risk Score', 'Remaining'],
                        datasets: [{
                            data: [riskScore, 100 - riskScore],
                            backgroundColor: [color, '#e2e8f0'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: {
                            legend: {
                                display: false
                            },
                            tooltip: {
                                enabled: true
                            }
                        }
                    }
                });

            } catch (error) {
                console.error(`Error loading AI data for ${slug}:`, error);
                textPanel.innerHTML = '<p>Error loading analysis. Please try again later.</p>';
                chartContainer.innerHTML = '<p>Error loading chart. Please try again later.</p>';
            }
        }
    </script>
</body>
</html>
